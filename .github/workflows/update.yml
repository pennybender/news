name: Update news

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes (GitHub sometimes runs these a little late)
  workflow_dispatch:          # "Run workflow" button on the Actions tab
  push:
    branches: [main]          # rebuild straight away when you edit feeds.toml or the app

permissions:
  contents: write   # only used by the keep-alive step
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - id: pages
        uses: actions/configure-pages@v5

      # Carries stories over from the live site, adds new ones, writes site/
      - name: Fetch feeds and build
        run: python -m news.build --out site --previous "${{ steps.pages.outputs.base_url }}/data/articles.json"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4

      # GitHub pauses scheduled workflows in repos with no commits for 60 days. This makes a tiny commit
      # every ~45 days so the paper keeps updating.
      - name: Keep schedule alive
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( ($(date +%s) - last) / 86400 )) -ge 45 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            date -u > .keepalive
            git add .keepalive
            git commit -m "Keep scheduled updates alive [skip ci]"
            git push
          fi
