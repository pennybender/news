name: Update news

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes (GitHub sometimes runs these a little late)
  workflow_dispatch:          # "Run workflow" button on the Actions tab
  push:
    branches: [main]          # rebuild straight away when you edit feeds.toml or the app

permissions:
  contents: write   # only used by the keep-alive step

concurrency:
  group: news-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check Cloudflare secrets
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID under Settings → Secrets and variables → Actions (see README)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # The previous run's stories and article texts, kept between runs in the Actions cache (not in the repo)
      - name: Restore previous stories
        uses: actions/cache/restore@v4
        with:
          path: state
          key: news-state-${{ github.run_id }}
          restore-keys: news-state-

      - name: Fetch feeds and build
        env:
          QUILLETTE_EMAIL_FEED: ${{ secrets.QUILLETTE_EMAIL_FEED }}
        run: python -m news.build --out site --state state

      - name: Save stories for next run
        uses: actions/cache/save@v4
        with:
          path: state
          key: news-state-${{ github.run_id }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          preCommands: wrangler pages project create news --production-branch=main || true
          command: pages deploy site --project-name=news --branch=main --commit-dirty=true

      # GitHub pauses scheduled workflows in repos with no commits for 60 days. This makes a tiny commit
      # every ~45 days so the paper keeps updating.
      - name: Keep schedule alive
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( ($(date +%s) - last) / 86400 )) -ge 45 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            date -u > .keepalive
            git add .keepalive
            git commit -m "Keep scheduled updates alive [skip ci]"
            git push
          fi
