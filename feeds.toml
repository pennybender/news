# News — sources and sections.
# Edit freely (you can do it on github.com). The next scheduled update picks up changes.
#
# kind:      "rss" (RSS/Atom feed). There is also an "afr" scraper in news/sources.py, unused for now.
# weight:    how much this source counts when picking the front page (1.0 = normal)
# long_read: true sends its stories to the Long reads tab as well
# include:   optional keywords; only stories mentioning one of them are kept (good for arXiv)
# exclude:   optional; drop stories whose headline contains any of these
# url_env:   optional; read the feed address from a GitHub secret (for private feeds)
# fetch_page: optional; always read the full article from its web page (feeds that only send excerpts)
# digest_marker / digest_min: optional; skip items whose text repeats a phrase like "read now" that many times
# keep_days: optional; keep this source's stories longer than the default (good for rare posters)

[settings]
keep_days = 7             # stories older than this drop off (saved ones stay on your phone)
front_page_size = 7       # stories in the "Today" lead block
max_per_section = 2       # cap per section in the lead block
dedupe_threshold = 0.6    # 0–1; lower merges more aggressively

[[sections]]
id = "tech"
name = "Tech"
colour = "#3d5a80"
weight = 1.0

[[sections]]
id = "science"
name = "Science"
colour = "#2a7f62"
weight = 1.0

[[sections]]
id = "money"
name = "Money"
colour = "#9c6644"
weight = 1.0

[[sections]]
id = "letters"
name = "Letters & Ideas"
colour = "#7b2d26"
weight = 0.9

[[sections]]
id = "sea"
name = "Sea"
colour = "#1d6f8b"
weight = 0.8

# ---------- Tech ----------
# Builders, radio and home-lab tinkering rather than industry and security news.
[[sources]]
name = "Hackaday"
section = "tech"
kind = "rss"
url = "https://hackaday.com/blog/feed/"
weight = 1.3

[[sources]]
name = "RTL-SDR"
section = "tech"
kind = "rss"
url = "https://www.rtl-sdr.com/feed/"
weight = 1.2

[[sources]]
name = "Jeff Geerling"
section = "tech"
kind = "rss"
url = "https://www.jeffgeerling.com/blog.xml"
weight = 1.2

# Hacker News, but only maker / radio / hardware / home-lab stories
[[sources]]
name = "Hacker News"
section = "tech"
kind = "rss"
url = "https://hnrss.org/frontpage?points=100"
weight = 0.9
include = ["radio", "sdr", "antenna", "ham ", "amateur", "moon", "satellite", "aircraft", "ads-b", "doppler",
           "spectrum", "esp32", "arduino", "raspberry", "fpga", "pcb", "solder", "3d print", "cnc", "laser",
           "telescope", "gps", "lora", "meshtastic", "homelab", "home lab", "home network", "router", "nas ",
           "self-host", "oscilloscope", "reverse engineer", "teardown", "hardware", "sensor", "robot", "drone",
           "rocket", "microcontroller", "circuit", "electronics", "gadget", "diy", "i built", "show hn",
           "retro", "keyboard", "clock", "ntp", "wifi", "wi-fi", "ethernet", "zigbee", "home assistant"]
exclude = ["cve", "vulnerability", "exploit", "breach", "postgres", "funding", "layoff", "acquires", "lawsuit"]

