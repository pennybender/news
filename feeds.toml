# Your Quillette emails, turned into a feed by kill-the-newsletter.com. The feed address is private,
# so it's kept in the GitHub secret QUILLETTE_EMAIL_FEED rather than here.
[[sources]]
name = "Quillette (email)"
section = "letters"
kind = "rss"
url_env = "QUILLETTE_EMAIL_FEED"
weight = 1.3
long_read = true
max_items = 20
exclude = ["confirm", "verification", "forwarding", "verify", "sign in", "log in", "receipt", "invoice",
           "weekly letter", "quillette weekly", "digest"]
digest_marker = "read now"   # emails with 2+ of these are link round-ups: they stay in your inbox
digest_min = 2

